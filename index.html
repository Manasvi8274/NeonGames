<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Games — Snake &amp; Brick Breaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 1rem;
            background: #050510;
            font-family: 'Orbitron', monospace;
            color: #eef2ff;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-align: center;
            text-shadow: 0 0 20px #0095ff;
        }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            max-width: 700px;
            width: 100%;
        }
        .card {
            flex: 1 1 240px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,149,255,0.4);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 24px rgba(0,149,255,0.5);
        }
        .card h2 { margin: 0 0 0.5rem; font-size: 1.2rem; color: #0095ff; }
        .card p { margin: 0; font-size: 0.85rem; color: #a0b0d0; }
    </style>
</head>
<body>
    <h1>🎮 Twin Games</h1>
    <div class="cards">
        <a class="card" href="snake/index.html">
            <h2>🐍 Snakemania</h2>
            <p>Classic snake with power-ups</p>
        </a>
        <a class="card" href="brick_breaker/index.html">
            <h2>🧱 Brick Breaker</h2>
            <p>Break bricks, chase high score</p>
        </a>
    </div>
</body>
</html>
