<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arcade — 6 Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/hub.css">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('game-theme') === 'light') {
                document.body.classList.add('light-mode');
            }
        });
    </script>
</head>
<body>
    <div class="hub-header">
        <span class="hub-emoji">🕹️</span>
        <h1>NEON ARCADE</h1>
    </div>
    <div class="hub">
        <div class="active-game-pane">
            <iframe id="gameFrame" title="Active game"></iframe>
        </div>
        <nav class="game-rail" id="gameRail"></nav>
    </div>
    <script src="shared/hub.js"></script>
</body>
</html>
