<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js" defer></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/chrome.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../shared/leaderboard-modal.css">
    <link rel="stylesheet" href="../shared/compact-media.css">
    <style>:root { --accent: #b388ff; --hi-color: #ffc400; }</style>
    <script src="../shared/theme.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" defer></script>
    <script src="../shared/firebase-config.js" defer></script>
    <script src="../shared/leaderboard.js" defer></script>
    <script>document.addEventListener('DOMContentLoaded', function () { Leaderboard.init(firebaseConfig); Leaderboard.syncHiscoreDisplay('chess'); });</script>
    <script src="../shared/sfx.js" defer></script>
    <script src="../shared/chrome.js" defer></script>
    <script src="js/ai.js" defer></script>
    <script src="js/index.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.top !== window.self) {
                const sw = document.querySelector('.switch-btn');
                if (sw && sw.parentElement) sw.parentElement.style.display = 'none';
            }
        });
    </script>
</head>
<body>
    <div class="body">
        <div class="sidebar">
            <h1 class="game-title">CHESS</h1>
            <div class="score-card">
                <div class="score-label">Turn</div>
                <div id="turnBox" class="score-value">White</div>
            </div>
            <div class="score-card hi-card">
                <div class="score-label hi-label">Best Streak vs CPU</div>
                <div id="hiscoreBox" class="score-value hi-value">0</div>
            </div>
            <div id="statusBox"></div>
            <button class="neon-btn" id="modeBtn" onclick="toggleMode()">Mode: PvP</button>
            <button class="neon-btn" id="colorBtn" onclick="toggleColor()" style="display:none;">You play: White</button>
            <button class="neon-btn" id="difficultyBtn" onclick="cycleDifficulty()" style="display:none;">Difficulty: Medium</button>
            <button class="neon-btn pause-btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button class="neon-btn theme-toggle" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
            <button class="neon-btn" onclick="resetBoard()">🔄 Restart</button>
            <button class="neon-btn leaderboard-btn" onclick="Leaderboard.showBoard('chess')">🏆 Leaderboard</button>
            <a href="../index.html">
                <button class="neon-btn switch-btn">🕹️ All Games</button>
            </a>
        </div>
        <div class="game-area">
            <div id="board"></div>
            <div id="pauseOverlay" class="pause-overlay" style="display:none;">
                <span>PAUSED</span>
                <small>Press Esc to resume</small>
            </div>
            <div id="promoOverlay" class="chrome-overlay hidden" style="z-index:60;">
                <div class="chrome-title" style="font-size:18px;">PROMOTE PAWN</div>
                <div id="promoChoices" style="display:flex; gap:14px; margin-top:10px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
