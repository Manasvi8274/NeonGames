<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETRIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/chrome.css">
    <link rel="stylesheet" href="../shared/depth.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../shared/leaderboard-modal.css">
    <link rel="stylesheet" href="../shared/compact-media.css">
    <style>:root { --accent: #00e5ff; --hi-color: #ffc400; }</style>
    <script src="../shared/theme.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../shared/firebase-config.js"></script>
    <script src="../shared/leaderboard.js"></script>
    <script>Leaderboard.init(firebaseConfig);</script>
    <script src="../shared/responsive.js"></script>
    <script src="../shared/sfx.js"></script>
    <script src="../shared/chrome.js"></script>
    <script src="js/index.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.top !== window.self) {
                const sw = document.querySelector('.switch-btn');
                if (sw && sw.parentElement) sw.parentElement.style.display = 'none';
            }
        });
    </script>
</head>
<body>
    <div class="body">
        <div class="sidebar">
            <h1 class="game-title">TETRIS</h1>
            <div class="score-card">
                <div class="score-label">Score</div>
                <div id="scoreBox" class="score-value">0</div>
            </div>
            <div class="score-card hi-card">
                <div class="score-label hi-label">Hi Score</div>
                <div id="hiscoreBox" class="score-value hi-value">0</div>
            </div>
            <div class="tetris-stat-row">
                <div class="score-card small">
                    <div class="score-label">Level</div>
                    <div id="levelBox" class="score-value">1</div>
                </div>
                <div class="score-card small">
                    <div class="score-label">Lines</div>
                    <div id="linesBox" class="score-value">0</div>
                </div>
            </div>
            <div class="tetris-preview-row">
                <div class="score-card small">
                    <div class="score-label">Hold</div>
                    <canvas id="holdCanvas" width="64" height="64"></canvas>
                </div>
                <div class="score-card small">
                    <div class="score-label">Next</div>
                    <canvas id="nextCanvas" width="64" height="64"></canvas>
                </div>
            </div>
            <button class="neon-btn pause-btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button class="neon-btn theme-toggle" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
            <button class="neon-btn" onclick="startNewGame()">🔄 Restart</button>
            <button class="neon-btn" onclick="resetHiscore()">Reset Hi Score</button>
            <button class="neon-btn leaderboard-btn" onclick="Leaderboard.showBoard('tetris')">🏆 Leaderboard</button>
            <a href="../index.html">
                <button class="neon-btn switch-btn">🕹️ All Games</button>
            </a>
        </div>
        <div class="game-area">
            <div class="arcade-bezel">
                <div class="tilt-3d-wrap">
                    <canvas id="board" class="tilt-3d-canvas"></canvas>
                </div>
            </div>
            <div id="pauseOverlay" class="pause-overlay" style="display:none;">
                <span>PAUSED</span>
                <small>Press Esc to resume</small>
            </div>
            <div class="touch-controls">
                <button type="button" id="btnHold" class="touch-btn" aria-label="Hold">⇄</button>
                <button type="button" id="btnLeft" class="touch-btn" aria-label="Move left">◀</button>
                <button type="button" id="btnDown" class="touch-btn" aria-label="Soft drop">▼</button>
                <button type="button" id="btnRight" class="touch-btn" aria-label="Move right">▶</button>
                <button type="button" id="btnRotate" class="touch-btn" aria-label="Rotate">↻</button>
                <button type="button" id="btnDrop" class="touch-btn" aria-label="Hard drop">⤓</button>
            </div>
        </div>
    </div>
</body>
</html>
